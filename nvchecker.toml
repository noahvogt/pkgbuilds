# upstream version sources, one entry per package (see nvchecker(1))
[__config__]
keyfile = "keyfile.toml"
# nvchecker only writes newver when oldver is declared too; the file itself is
# never created, versions are compared against .SRCINFO in scripts/check-updates
oldver = "old_ver.json"
newver = "new_ver.json"

[fluffychat-color-emoji]
source = "github"
github = "krille-chan/fluffychat"
use_latest_release = true
prefix = "v"

[openconnect-ms-auth]
source = "github"
github = "noahvogt/openconnect-ms-auth"
# tags, not releases: `just release` tags without creating a GitHub release
use_max_tag = true
prefix = "v"

[chromium-extension-return-youtube-dislike]
source = "github"
github = "Anarios/return-youtube-dislike"
# max matching release, not latest: upstream also publishes userscript-v* releases
use_max_release = true
include_regex = 'v\d+(\.\d+)+'
prefix = "v"

[issuu-dl]
source = "github"
github = "noahvogt/issuu-dl"
use_max_tag = true
prefix = "v"

[libva-v4l2_request-asahi]
source = "github"
github = "sofus13/libva-v4l2_request"
use_max_tag = true

[tibasicc]
source = "github"
github = "noahvogt/tibasicc"
use_max_tag = true
prefix = "v"

[headlamp-bin]
source = "github"
github = "kubernetes-sigs/headlamp"
use_latest_release = true
prefix = "v"

[vpcs]
source = "github"
github = "GNS3/vpcs"
use_latest_release = true
prefix = "v"
