# upstream version sources, one entry per package (see nvchecker(1))
[__config__]
keyfile = "keyfile.toml"
# nvchecker only writes newver when oldver is declared too; the file itself is
# never created, versions are compared against .SRCINFO in scripts/check-updates
oldver = "old_ver.json"
newver = "new_ver.json"

[fluffychat-color-emoji]
source = "github"
github = "krille-chan/fluffychat"
use_latest_release = true
prefix = "v"

[openconnect-ms-auth]
source = "github"
github = "noahvogt/openconnect-ms-auth"
# tags, not releases: `just release` tags without creating a GitHub release
use_max_tag = true
prefix = "v"
